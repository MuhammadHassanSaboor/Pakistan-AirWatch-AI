# Horizontal Pod Autoscaler.
#
# Requires metrics-server:  minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airwatch-api-hpa
  namespace: airwatch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airwatch-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Scale down slowly: air-quality traffic is bursty around the
      # hourly data refresh, and flapping replicas would cause cold
      # model loads on every spike.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
