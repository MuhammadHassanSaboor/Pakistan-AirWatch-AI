# Non-secret configuration only.
#
# Credentials live in the Secret, never here: a ConfigMap is readable
# by anyone with namespace read access and is routinely committed to
# Git, which is exactly how tokens leak.
apiVersion: v1
kind: ConfigMap
metadata:
  name: airwatch-config
  namespace: airwatch
data:
  APP_VERSION: "0.1.0"
  API_HOST: "0.0.0.0"
  API_PORT: "5000"
  MODEL_SOURCE: "local"
  LOCAL_MODEL_PATH: "/app/models/production"
  MODEL_NAME: "pm25-forecaster"
  MODEL_STAGE: "Production"
  ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
  FLASK_ENV: "production"
