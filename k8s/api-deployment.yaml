apiVersion: apps/v1
kind: Deployment
metadata:
  name: airwatch-api
  namespace: airwatch
  labels:
    app: airwatch-api
    component: prediction-api
spec:
  replicas: 3
  revisionHistoryLimit: 5          # enables `kubectl rollout undo`
  selector:
    matchLabels:
      app: airwatch-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0            # zero-downtime: never drop below 3 ready

  template:
    metadata:
      labels:
        app: airwatch-api
        component: prediction-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"

    spec:
      # Spread replicas across nodes so one node failure cannot take
      # out the whole service. On single-node Minikube this is a soft
      # preference, which is why it is "preferred" not "required".
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: airwatch-api
                topologyKey: kubernetes.io/hostname

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          image: airwatch-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: airwatch-config
            - secretRef:
                name: airwatch-secrets
                optional: true     # the API runs without MLflow creds

          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "1Gi"
              cpu: "600m"

          # Readiness gates traffic; liveness restarts a wedged pod.
          # The two differ on purpose: a pod whose model has not loaded
          # yet should receive no traffic but must NOT be killed, or it
          # would crash-loop before it could ever finish loading.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 4

          # Gives a slow first model load up to 2 minutes before the
          # liveness probe starts counting against the pod.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: model-store
              mountPath: /app/models/production
              readOnly: true
            - name: tmp
              mountPath: /tmp

          lifecycle:
            preStop:
              exec:
                # Let in-flight requests finish before the pod dies.
                command: ["sh", "-c", "sleep 5"]

      volumes:
        - name: model-store
          emptyDir: {}             # replace with a PVC in production
        - name: tmp
          emptyDir: {}

      terminationGracePeriodSeconds: 30
