# TEMPLATE ONLY — never commit real values.
#
# Create the real Secret imperatively so the values never touch Git:
#
#   kubectl create secret generic airwatch-secrets -n airwatch \
#     --from-literal=MLFLOW_TRACKING_USERNAME='<your-username>' \
#     --from-literal=MLFLOW_TRACKING_PASSWORD='<your-token>'
#
# In a real deployment these would come from an external secret store
# (AWS Secrets Manager, Vault) via the External Secrets Operator,
# because a Kubernetes Secret is only base64-encoded, not encrypted.
apiVersion: v1
kind: Secret
metadata:
  name: airwatch-secrets
  namespace: airwatch
type: Opaque
stringData:
  MLFLOW_TRACKING_USERNAME: "REPLACE_ME"
  MLFLOW_TRACKING_PASSWORD: "REPLACE_ME"
