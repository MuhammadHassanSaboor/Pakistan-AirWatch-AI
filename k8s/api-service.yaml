apiVersion: v1
kind: Service
metadata:
  name: airwatch-api-svc
  namespace: airwatch
  labels:
    app: airwatch-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
spec:
  # NodePort keeps the demo free: a LoadBalancer Service on a managed
  # cluster provisions a billable cloud load balancer. The trade-off is
  # documented in REPORT.md -- this is not how it would be exposed in
  # production.
  type: NodePort
  selector:
    app: airwatch-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30080
      protocol: TCP
  sessionAffinity: None            # round-robin across replicas
