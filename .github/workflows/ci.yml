# Continuous integration.
#
# The job chain IS the quality gate: `build` declares `needs: test`, so
# a failing test makes the Docker image physically impossible to
# produce. Nothing can be deployed from a red run.
#
# Free for public repositories, which is why this repo is public.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── 1. style and security ─────────────────────────────────
  quality:
    name: Lint & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks needs history

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tooling
        run: pip install ruff==0.6.9 pip-audit==2.7.3

      - name: Ruff lint
        run: ruff check src tests pipelines --output-format=github

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements-api.txt --desc
        continue-on-error: true    # report, do not block, on advisories

  # ── 2. tests — the gate everything else depends on ────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: |
          pytest -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junitxml=junit.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  # ── 3. config sanity ──────────────────────────────────────
  config:
    name: Config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pyyaml pandas python-dotenv

      - name: Configs parse and agree with each other
        run: |
          python - <<'PY'
          from src.config import DATA_CFG, MODEL_CFG, split_dates
          import pandas as pd
          t, v = split_dates()
          assert pd.Timestamp(t) < pd.Timestamp(v), "split dates out of order"
          assert MODEL_CFG["quality_gate"]["max_test_mae"] > 0
          assert DATA_CFG["cities"]["target_count"] >= 100
          print("configs OK")
          PY

      - name: The 134-city reference table builds and validates
        run: |
          python -m src.data.cities
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/reference/pakistan_cities.csv")
          assert len(df) >= 100, f"only {len(df)} cities"
          assert df.city_id.is_unique
          print(f"{len(df)} cities OK")
          PY

      - name: .env.example contains no real secrets
        run: |
          python - <<'PY'
          import re, sys
          bad = []
          for line in open(".env.example", encoding="utf-8"):
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, _, val = line.partition("=")
              val = val.strip()
              if not val:
                  continue
              # Placeholders are fine; anything that looks like a real
              # credential is not.
              if re.fullmatch(r"[0-9a-f]{32,}", val):
                  bad.append(key)
              if len(val) > 24 and not any(
                  w in val.lower()
                  for w in ("your", "change-me", "localhost", "http", "example", "postgresql")
              ):
                  bad.append(key)
          if bad:
              sys.exit(f"Possible real secrets in .env.example: {sorted(set(bad))}")
          print(".env.example OK")
          PY

  # ── 4. container build — only reachable if tests passed ───
  build:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: [quality, test, config]   # ← THE QUALITY GATE
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          tags: airwatch-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: airwatch-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"        # raise to "1" once findings are triaged

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 5000:5000 \
            -e MODEL_SOURCE=local \
            airwatch-api:${{ github.sha }}

          echo "waiting for the service to come up..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || true)
            # 503 is expected: no model is baked into the image.
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "service responded with $code"
              break
            fi
            sleep 2
          done

          echo "--- /health ---"
          curl -sS http://localhost:5000/health | head -c 400; echo
          echo "--- /api/cities ---"
          curl -sS http://localhost:5000/api/cities | head -c 200; echo
          echo "--- /metrics ---"
          curl -sS http://localhost:5000/metrics | grep -c airwatch_ || true

          # The container must answer; a non-response is a failure.
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:5000/api/cities \
            | grep -q 200

          docker logs smoke | tail -20
          docker rm -f smoke

  # ── 5. frontend ───────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ── 6. summary ────────────────────────────────────────────
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [quality, test, config, build, frontend]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed — deployment is blocked."
            exit 1
          fi
          echo "All quality gates passed."
