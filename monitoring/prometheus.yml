global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: pakistan-airwatch-ai

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: airwatch-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]
        labels:
          service: prediction-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
